name: Configurator on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configurator/**'
      - 'tests/configurator/**'
      - 'tests/static-server.js'
      - 'scripts/build-pages.sh'
      - 'rollup.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: bash scripts/build-pages.sh

      - name: Test the configurator
        run: |
          npx playwright install --with-deps chromium
          npm run test:configurator
        env:
          CI: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}configurator/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
